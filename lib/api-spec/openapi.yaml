openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Washer & Dryer Rental CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser authentication endpoints.
  - name: tenants
    description: Business account (tenant) management.
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: leads
    description: Lead pipeline
  - name: rentals
    description: Rental tracking
  - name: agreements
    description: Rental agreement file attachments
  - name: square
    description: Square integration
  - name: dashboard
    description: Dashboard and analytics
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /tenants/current:
    get:
      tags: [tenants]
      operationId: getCurrentTenant
      summary: Get the current user's business account
      responses:
        '200':
          description: Current tenant info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '401':
          description: Unauthorized
    patch:
      tags: [tenants]
      operationId: updateCurrentTenant
      summary: Update the current user's business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '200':
          description: Updated tenant info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: No business account found

  /tenants:
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Create a new business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          description: Invalid input
        '409':
          description: Already belongs to a business account

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Clients ──────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Properties ─────────────────────────────────────────────────────────────
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Leads ─────────────────────────────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: stage
          in: query
          schema:
            type: ["string", "null"]
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Rentals ───────────────────────────────────────────────────────────────
  /rentals:
    get:
      operationId: listRentals
      tags: [rentals]
      summary: List rentals
      parameters:
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
        - name: expiringSoon
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
    post:
      operationId: createRental
      tags: [rentals]
      summary: Create a rental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /rentals/{id}:
    get:
      operationId: getRental
      tags: [rentals]
      summary: Get a rental
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "404":
          description: Not found
    patch:
      operationId: updateRental
      tags: [rentals]
      summary: Update a rental
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
    delete:
      operationId: deleteRental
      tags: [rentals]
      summary: Delete a rental
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Rental Agreements ─────────────────────────────────────────────────────
  /clients/{clientId}/agreements:
    get:
      operationId: listAgreements
      tags: [agreements]
      summary: List rental agreement files for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalAgreement"
    post:
      operationId: createAgreement
      tags: [agreements]
      summary: Attach a rental agreement file to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalAgreement"

  /clients/{clientId}/agreements/{id}:
    delete:
      operationId: deleteAgreement
      tags: [agreements]
      summary: Delete a rental agreement attachment
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Square ────────────────────────────────────────────────────────────────
  /square/payments:
    get:
      operationId: listSquarePayments
      tags: [square]
      summary: List synced Square payments
      parameters:
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquarePayment"

  /square/invoices:
    get:
      operationId: listSquareInvoices
      tags: [square]
      summary: List synced Square invoices
      parameters:
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquareInvoice"

  /square/sync:
    post:
      operationId: syncSquare
      tags: [square]
      summary: Sync customers, payments and invoices from Square
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareSyncResult"
        "503":
          description: Square not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /square/status:
    get:
      operationId: getSquareStatus
      tags: [square]
      summary: Check if Square is connected
      responses:
        "200":
          description: Square connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareStatus"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-payments:
    get:
      operationId: getRecentPayments
      tags: [dashboard]
      summary: Get recent payments for dashboard feed
      responses:
        "200":
          description: Recent payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquarePayment"

  # ── Object Storage ────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Client ───────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
          enum: [lead, active_renter, past_customer]
        propertyId:
          type: ["integer", "null"]
        propertyName:
          type: ["string", "null"]
        squareCustomerId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        activeRentalCount:
          type: integer
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [lead, active_renter, past_customer]
          default: lead
        propertyId:
          type: ["integer", "null"]
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
          enum: [lead, active_renter, past_customer]
        propertyId:
          type: ["integer", "null"]
        squareCustomerId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── Property ─────────────────────────────────────────────────────────────
    Property:
      type: object
      required: [id, name, unitCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        unitCount:
          type: integer
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PropertyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
        unitCount:
          type: integer
          default: 0
        notes:
          type: string

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: ["string", "null"]
        unitCount:
          type: integer
        notes:
          type: ["string", "null"]

    # ── Lead ─────────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, clientId, stage, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        clientPhone:
          type: ["string", "null"]
        clientEmail:
          type: ["string", "null"]
        stage:
          type: string
          enum: [contacted, agreement_sent, term_selected, application_sent, converted]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    LeadInput:
      type: object
      required: [clientId, stage]
      properties:
        clientId:
          type: integer
        stage:
          type: string
          enum: [contacted, agreement_sent, term_selected, application_sent, converted]
          default: contacted
        notes:
          type: string

    LeadUpdate:
      type: object
      properties:
        stage:
          type: string
          enum: [contacted, agreement_sent, term_selected, application_sent, converted]
        notes:
          type: ["string", "null"]

    # ── Rental ───────────────────────────────────────────────────────────────
    Rental:
      type: object
      required: [id, clientId, startDate, termMonths, monthlyRate, monthsRemaining, isExpiringSoon, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        unitDescription:
          type: ["string", "null"]
        startDate:
          type: string
        termMonths:
          type: integer
        monthlyRate:
          type: number
        monthsRemaining:
          type: integer
        isExpiringSoon:
          type: boolean
        notes:
          type: ["string", "null"]
        paymentStatus:
          type: ["string", "null"]
        createdAt:
          type: string

    RentalInput:
      type: object
      required: [clientId, startDate, termMonths, monthlyRate]
      properties:
        clientId:
          type: integer
        unitDescription:
          type: string
        startDate:
          type: string
        termMonths:
          type: integer
          minimum: 1
        monthlyRate:
          type: number
          minimum: 0
        notes:
          type: string

    RentalUpdate:
      type: object
      properties:
        unitDescription:
          type: ["string", "null"]
        startDate:
          type: string
        termMonths:
          type: integer
          minimum: 1
        monthlyRate:
          type: number
          minimum: 0
        notes:
          type: ["string", "null"]

    # ── Rental Agreement ─────────────────────────────────────────────────────
    RentalAgreement:
      type: object
      required: [id, clientId, fileName, objectPath, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        rentalId:
          type: ["integer", "null"]
        fileName:
          type: string
        objectPath:
          type: string
        createdAt:
          type: string

    AgreementInput:
      type: object
      required: [fileName, objectPath]
      properties:
        rentalId:
          type: ["integer", "null"]
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1

    # ── Square ───────────────────────────────────────────────────────────────
    SquarePayment:
      type: object
      required: [id, amount, status, paymentDate, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        squarePaymentId:
          type: string
        amount:
          type: number
        status:
          type: string
        description:
          type: ["string", "null"]
        paymentDate:
          type: string
        createdAt:
          type: string

    SquareInvoice:
      type: object
      required: [id, amount, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        squareInvoiceId:
          type: string
        amount:
          type: number
        status:
          type: string
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string

    SquareSyncResult:
      type: object
      required: [customersImported, paymentsImported, invoicesImported]
      properties:
        customersImported:
          type: integer
        paymentsImported:
          type: integer
        invoicesImported:
          type: integer

    SquareStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        merchantId:
          type: ["string", "null"]

    # ── Dashboard ────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [activeRentals, expiringSoon, openLeads, rentCollectedThisMonth, overduePayments, totalProperties, totalRevenue, totalClients]
      properties:
        activeRentals:
          type: integer
        expiringSoon:
          type: integer
        openLeads:
          type: integer
        rentCollectedThisMonth:
          type: number
        overduePayments:
          type: integer
        totalProperties:
          type: integer
        totalRevenue:
          type: number
        totalClients:
          type: integer

    # ── Storage ──────────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    # ── Auth ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    # ── Tenants ───────────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
